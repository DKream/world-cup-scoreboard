<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>World Cup Draft Scoreboard</title>

  <style>
   <style>
  body {
    font-family: "Trebuchet MS", "Comic Sans MS", Arial, sans-serif;
    background:
      radial-gradient(circle at top left, rgba(255,255,255,0.06), transparent 28%),
      radial-gradient(circle at bottom right, rgba(255,255,255,0.04), transparent 30%),
      #21402f;
    color: #f6f1df;
    margin: 0;
    padding: 24px;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 36px 36px;
    opacity: 0.35;
  }

  .container {
    max-width: 1150px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  h1 {
    text-align: center;
    font-size: 2.6rem;
    letter-spacing: 1px;
    color: #fff8dc;
    text-shadow: 0 0 2px rgba(255,255,255,0.7);
    margin-bottom: 10px;
  }

  h2 {
    text-align: center;
    color: #fff8dc;
    letter-spacing: 0.5px;
    text-shadow: 0 0 1px rgba(255,255,255,0.5);
  }

  .nav {
    text-align: center;
    margin-bottom: 24px;
  }

  .nav a {
    color: #f3d36b;
    font-weight: bold;
    text-decoration: none;
    border-bottom: 2px dashed rgba(243, 211, 107, 0.75);
    padding-bottom: 3px;
  }

  .nav a:hover {
    color: #ffe58a;
  }

  .card {
    background:
      linear-gradient(135deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015)),
      #244b36;
    border: 2px solid rgba(246, 241, 223, 0.55);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow:
      inset 0 0 18px rgba(0,0,0,0.28),
      0 8px 22px rgba(0,0,0,0.28);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
  }

  th, td {
    padding: 12px;
    border-bottom: 2px dashed rgba(246, 241, 223, 0.32);
    text-align: left;
    vertical-align: top;
  }

  th {
    background: rgba(255,255,255,0.06);
    color: #f3d36b;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .rank {
    font-weight: bold;
    font-size: 1.2rem;
    color: #f3d36b;
  }

  .score {
    font-weight: bold;
    font-size: 1.25rem;
    color: #fff8dc;
  }

  .small {
    opacity: 0.9;
    font-size: 0.9rem;
    color: #eee6c8;
  }

  .warning {
    color: #ffdf70;
    font-weight: bold;
  }

  .pill {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1.5px solid rgba(246, 241, 223, 0.55);
    background: rgba(255,255,255,0.06);
    margin: 2px;
    font-size: 0.85rem;
    color: #fff8dc;
    white-space: nowrap;
    box-shadow: inset 0 0 8px rgba(255,255,255,0.04);
  }

  .first-place {
    background: rgba(243, 211, 107, 0.13);
  }

  button {
    background: transparent;
    color: #fff8dc;
    border: 2px solid rgba(246, 241, 223, 0.7);
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: inset 0 0 8px rgba(255,255,255,0.08);
  }

  button:hover {
    background: rgba(255,255,255,0.08);
  }

  .mobile-leaderboard {
    display: none;
  }

  .mobile-player-card {
    background:
      linear-gradient(135deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015)),
      #244b36;
    border: 2px solid rgba(246, 241, 223, 0.55);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow:
      inset 0 0 18px rgba(0,0,0,0.28),
      0 8px 22px rgba(0,0,0,0.28);
  }

  .mobile-player-header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-bottom: 10px;
  }

  .mobile-rank {
    color: #f3d36b;
    font-weight: bold;
    font-size: 1.1rem;
  }

  .mobile-total {
    font-weight: bold;
    font-size: 1.2rem;
    color: #fff8dc;
  }

  @media (max-width: 800px) {
    body {
      padding: 12px;
    }

    h1 {
      font-size: 1.9rem;
      line-height: 1.15;
    }

    .desktop-leaderboard {
      display: none;
    }

    .mobile-leaderboard {
      display: block;
    }

    .nation-score-table-wrapper {
      overflow-x: auto;
    }

    table {
      font-size: 0.85rem;
    }

    th, td {
      padding: 8px;
    }

    .card {
      padding: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
    }
  }
</style>
  </style>
</head>
<body>
  <div class="container">
    <h1>World Cup Draft Scoreboard</h1>

    <div class="nav">
      <a href="/team-assignments.html">View Team Assignments</a>
    </div>

    <div class="card">
      <button onclick="loadScores()">Refresh Now</button>
      <p class="small" id="status">Loading scoreboard...</p>
      <p class="small warning" id="warning"></p>
    </div>

    <div class="card desktop-leaderboard">
      <h2>Leaderboard</h2>
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Drafted Nations</th>
            <th>Breakdown</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="leaderboard"></tbody>
      </table>
    </div>

    <div class="mobile-leaderboard">
      <h2>Leaderboard</h2>
      <div id="mobileLeaderboard"></div>
    </div>

    <div class="card">
      <h2>Nation Score Breakdown</h2>
      <div class="nation-score-table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nation</th>
              <th>Group</th>
              <th>R32</th>
              <th>R16</th>
              <th>QF</th>
              <th>SF</th>
              <th>3rd</th>
              <th>Final</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="nationScores"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadScores() {
      const leaderboard = document.getElementById("leaderboard");
      const mobileLeaderboard = document.getElementById("mobileLeaderboard");
      const nationScores = document.getElementById("nationScores");
      const status = document.getElementById("status");
      const warning = document.getElementById("warning");

      status.textContent = "Refreshing...";
      warning.textContent = "";

      try {
        const response = await fetch("/api/scores");
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.details || data.error || "Unable to load scores.");
        }

        leaderboard.innerHTML = "";
        mobileLeaderboard.innerHTML = "";
        nationScores.innerHTML = "";

        status.textContent =
          `Last updated: ${new Date(data.updatedAt).toLocaleString()} | ` +
          `Data source: ${data.source} | ` +
          `Events found: ${data.eventCount} | ` +
          `Cache: ${data.cacheStatus}`;

        if (data.warning) {
          warning.textContent = data.warning;
        }

        data.leaderboard.forEach((entry, index) => {
          const row = document.createElement("tr");

          if (index === 0) {
            row.className = "first-place";
          }

          const breakdown = entry.nationBreakdown
            .map(item => `<span class="pill">${escapeHtml(item.nation)}: ${item.score}</span>`)
            .join("");

          row.innerHTML = `
            <td class="rank">${index + 1}</td>
            <td>${escapeHtml(entry.player)}</td>
            <td>${entry.nations.map(escapeHtml).join(", ")}</td>
            <td>${breakdown}</td>
            <td class="score">${entry.total}</td>
          `;

          leaderboard.appendChild(row);

          const mobileCard = document.createElement("div");
          mobileCard.className = "mobile-player-card";

          mobileCard.innerHTML = `
            <div class="mobile-player-header">
              <div>
                <div class="mobile-rank">#${index + 1}</div>
                <strong>${escapeHtml(entry.player)}</strong>
              </div>
              <div class="mobile-total">${entry.total} pts</div>
            </div>

            <div class="small">Drafted Nations</div>
            <div>${entry.nations.map(nation => `<span class="pill">${escapeHtml(nation)}</span>`).join("")}</div>

            <div class="small" style="margin-top: 10px;">Breakdown</div>
            <div>${breakdown}</div>
          `;

          mobileLeaderboard.appendChild(mobileCard);
        });

        Object.entries(data.nationScores)
          .sort((a, b) => b[1].total - a[1].total)
          .forEach(([nation, score]) => {
            const row = document.createElement("tr");

            row.innerHTML = `
              <td>${escapeHtml(nation)}</td>
              <td>${score.group || 0}</td>
              <td>${score.r32 || 0}</td>
              <td>${score.r16 || 0}</td>
              <td>${score.qf || 0}</td>
              <td>${score.sf || 0}</td>
              <td>${score.third || 0}</td>
              <td>${score.final || 0}</td>
              <td class="score">${score.total || 0}</td>
            `;

            nationScores.appendChild(row);
          });

      } catch (error) {
        status.textContent = "Scoreboard could not load.";
        warning.textContent = error.message;
      }
    }

    loadScores();

    setInterval(loadScores, 30 * 1000);
  </script>
</body>
</html>
